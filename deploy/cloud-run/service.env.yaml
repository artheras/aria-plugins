# Non-secret settings. Replace project/origin; supply secrets through Secret Manager:
# ARIA_SESSION_SECRET, ARIA_MERCHANT_TOKEN (agent) and ARIA_MERCHANT_LOGIN_TOKEN
# (human browser login, different from the agent token; required in sandbox).
ARIA_MODE: demo
ARIA_STORE: firestore
GOOGLE_CLOUD_PROJECT: YOUR_PROJECT_ID
ARIA_FIRESTORE_DATABASE: '(default)'
ARIA_FIRESTORE_COLLECTION: aria_commerce_records
PUBLIC_URL: https://YOUR_COMMERCE_SERVICE_URL
ARIA_BIND_ALL: '1'
ARIA_DRAFT_LIMIT: '10'
ARIA_GLOBAL_DRAFT_LIMIT: '120'
ARIA_DAILY_DRAFT_LIMIT: '500'
ARIA_OWNER_DAILY_DRAFT_LIMIT: '50'
ARIA_LOGIN_LIMIT: '10'
