name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: test -z "$(gofmt -l apps packages cmd)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: make build
